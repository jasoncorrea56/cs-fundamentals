name: CD - Manual Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Target environment (dev|qa|prod)"
        required: true
        type: choice
        options:
          - "dev"
          - "qa"
          - "prod"
        default: "prod"
      image_tag:
        description: "ECR image tag to deploy (i.e. 0.7.6-a71e692)"
        required: true
        type: string
      canary_enabled:
        description: "Enable canary / blue-green (true/false)"
        required: false
        type: choice
        options:
          - "false"
          - "true"
        default: "true"
      canary_weight:
        description: "Canary traffic weight (0-100). 0=stage-only, 100=promote to stable."
        required: false
        type: string
        default: "0"
      force_prod:
        description: "Force prod routing (normally false - prod should come from deploy_env=prod)"
        required: false
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: read
  id-token: write

jobs:
  prepare-image-refs:
    name: Prepare image-refs for deploy
    runs-on: ubuntu-latest
    steps:
      - name: Create image-refs.env for manual deploy
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          set -Eeuo pipefail

          REPO="cs-fundamentals"

          if [ -z "${ECR_REGISTRY}" ]; then
            echo "ECR_REGISTRY secret is required (e.g. 9483....dkr.ecr.us-west-2.amazonaws.com)"
            exit 1
          fi

          # Mimic build.yaml's image-refs.env structure enough for deploy.yaml
          {
            echo "ghcr_ref="
            echo "ghcr_latest="
            echo "ghcr_version_sha="

            # Canonical ECR refs
            echo "ecr_ref=${ECR_REGISTRY}/${REPO}:${IMAGE_TAG}"
            echo "ecr_latest=${ECR_REGISTRY}/${REPO}:latest"
            echo "ecr_version_sha=${ECR_REGISTRY}/${REPO}:${IMAGE_TAG}"

            # Raw pieces for deploy.yaml
            echo "sha="
            echo "version_sha=${IMAGE_TAG}"
          } > image-refs.env

          echo "Generated image-refs.env:"
          cat image-refs.env

      - name: Upload image-refs artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-refs
          path: image-refs.env
          retention-days: 3

  deploy:
    name: Deploy existing image to EKS
    needs: prepare-image-refs
    uses: ./.github/workflows/deploy.yaml
    with:
      deploy_env:   ${{ inputs.deploy_env }}
      app_namespace: csf
      helm_release:  csf
      helm_chart_dir: ./helm

      # Canary / Blue-Green controls:
      # - canary_enabled=true, canary_weight=0 -> stage-only
      # - canary_enabled=true, canary_weight>0 -> canary / blue-green behavior
      canary_enabled:   ${{ inputs.canary_enabled }}
      canary_weight:    ${{ inputs.canary_weight }}
      canary_image_tag: ''

      force_prod: ${{ inputs.force_prod }}
    secrets: inherit

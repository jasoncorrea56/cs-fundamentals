name: CD - Deploy to EKS

on:
  workflow_call:
    inputs:
      deploy_env:
        description: "Target environment (dev|prod)"
        required: true
        type: string
      app_namespace:
        description: "Kubernetes namespace"
        required: false
        type: string
        default: csf
      helm_release:
        description: "Helm release name"
        required: false
        type: string
        default: csf
      helm_chart_dir:
        description: "Path to Helm chart"
        required: false
        type: string
        default: ./helm
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: true
      AWS_REGION:
        required: true
      EKS_CLUSTER_NAME:
        required: true
      ECR_REGISTRY:
        required: false
      APP_DOMAIN:
        required: false
      ACM_CERT_ARN:
        required: false

permissions:
  contents: read
  id-token: write

env:
  # Static wiring (overridable via inputs if needed later)
  K8S_NAMESPACE: ${{ inputs.app_namespace }}
  HELM_RELEASE: ${{ inputs.helm_release }}
  HELM_CHART_DIR: ${{ inputs.helm_chart_dir }}

  # Helm default fullname: "<release>-<chartName>" -> "csf-cs-fundamentals"
  APP_DEPLOYMENT_NAME: csf-cs-fundamentals
  APP_SERVICE_NAME: csf-cs-fundamentals

  # Deploy environment: dev|prod provided by caller
  DEPLOY_ENV: ${{ inputs.deploy_env }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    # GitHub Environments for protections:
    # - prod env when deploy_env == 'prod'
    # - dev env otherwise
    environment: ${{ inputs.deploy_env == 'prod' && 'prod' || 'dev' }}

    steps:
      - name: Checkout Repo at Built SHA
        uses: actions/checkout@v4

      - name: Download Built Image Refs from Artifact
        uses: actions/download-artifact@v4
        with:
          name: image-refs

      - name: Load Image Refs into Env
        id: imagerefs
        run: |
          set -Eeuo pipefail

          if [ ! -f "image-refs.env" ]; then
            echo "image-refs.env artifact missing; cannot deploy."
            exit 1
          fi

          # shellcheck source=/dev/null
          source image-refs.env

          echo "GHCR_REF=${ghcr_ref:-}"         >> "$GITHUB_ENV"
          echo "GHCR_LATEST=${ghcr_latest:-}"   >> "$GITHUB_ENV"
          echo "GHCR_VERSION=${ghcr_version:-}" >> "$GITHUB_ENV"

          echo "ECR_REF=${ecr_ref:-}"           >> "$GITHUB_ENV"
          echo "ECR_LATEST=${ecr_latest:-}"     >> "$GITHUB_ENV"
          echo "ECR_VERSION=${ecr_version:-}"   >> "$GITHUB_ENV"

          echo "SHA=${sha:-}"                   >> "$GITHUB_ENV"
          echo "VERSION=${version:-}"           >> "$GITHUB_ENV"

          IMAGE_TAG="${version:-${sha}}"

          if [ -z "${IMAGE_TAG}" ]; then
            echo "Missing version/sha in image-refs; refusing to deploy."
            exit 1
          fi

          if ! echo "${IMAGE_TAG}" | grep -Eq '^[a-zA-Z0-9._:-]+$'; then
            echo "Refusing unsafe IMAGE_TAG: '${IMAGE_TAG}'"
            exit 1
          fi

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

          if [ -n "${ecr_ref:-}" ]; then
            REGISTRY_REPO="${ecr_ref%:*}"
            REGISTRY="${REGISTRY_REPO%/*}"
            REPO="${REGISTRY_REPO#${REGISTRY}/}"
            echo "ECR_REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
            echo "ECR_REPO=${REPO}"         >> "$GITHUB_ENV"
          fi

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure KubeConfig (EKS)
        env:
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -Eeuo pipefail
          aws eks update-kubeconfig \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}"
          kubectl auth can-i get pods -A

      - name: Ensure namespace exists
        run: |
          set -Eeuo pipefail
          kubectl get ns "${K8S_NAMESPACE}" >/dev/null 2>&1 || \
            kubectl create ns "${K8S_NAMESPACE}"

      - name: Helm Upgrade (Artifact-driven Image)
        env:
          # Prefer ECR from artifact but fallback to configured ECR registry
          FALLBACK_ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ACM_CERT_ARN: ${{ secrets.ACM_CERT_ARN }}
        # - values.yaml: base defaults
        # - values-prod.yaml: prod-only hardening & secret wiring
        # - image.*: always from CI artifact (immutable + auditable)
        run: |
          set -Eeuo pipefail

          REGISTRY="${ECR_REGISTRY:-$FALLBACK_ECR_REGISTRY}"
          REPO="${ECR_REPO:-cs-fundamentals}"

          if [ -z "${REGISTRY}" ]; then
            echo "No ECR registry configured; cannot determine IMAGE_REPO."
            exit 1
          fi

          if [ -z "${IMAGE_TAG:-}" ]; then
            echo "IMAGE_TAG is not set; cannot deploy."
            exit 1
          fi

          IMAGE_REPO="${REGISTRY}/${REPO}"
          echo "Deploying ${IMAGE_REPO}:${IMAGE_TAG} to '${DEPLOY_ENV}'"

          HELM_CMD=(
            helm upgrade --install ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART_DIR }}
            --namespace ${{ env.K8S_NAMESPACE }}
            --create-namespace
            -f ${{ env.HELM_CHART_DIR }}/values.yaml
            --set image.repository="${IMAGE_REPO}"
            --set image.tag="${IMAGE_TAG}"
            --set serviceAccount.create=false
          )

          if [ "${DEPLOY_ENV}" = "prod" ]; then
            # Require prod routing inputs from secrets
            if [ -z "${APP_DOMAIN:-}" ] || [ -z "${ACM_CERT_ARN:-}" ]; then
              echo "APP_DOMAIN and/or ACM_CERT_ARN not set; cannot configure Ingress for prod."
              exit 1
            fi

            HELM_CMD+=(
              -f ${{ env.HELM_CHART_DIR }}/values-prod.yaml
              --set ingress.enabled=true
              --set ingress.className=alb
              --set ingress.hosts[0].host="${APP_DOMAIN}"
              --set ingress.hosts[0].paths[0].path="/"
              --set ingress.hosts[0].paths[0].pathType=Prefix
              --set-string ingress.annotations."alb\.ingress\.kubernetes\.io\/scheme"="internet-facing"
              --set-string ingress.annotations."alb\.ingress\.kubernetes\.io\/target-type"="ip"
              --set-string ingress.annotations."alb\.ingress\.kubernetes\.io\/healthcheck-path"="/api/v1/healthz"
              --set-string ingress.annotations."alb\.ingress\.kubernetes\.io\/certificate-arn"="${ACM_CERT_ARN}"
            )
          fi

          "${HELM_CMD[@]}"

      - name: Wait for rollout
        run: |
          set -Eeuo pipefail
          kubectl rollout status deploy/${{ env.APP_DEPLOYMENT_NAME }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide

      - name: In-cluster smoke test Job
        id: smoketest
        env:
          JOB_NAME: csf-smoke-${{ github.run_id }}
        run: |
          set -Eeuo pipefail

          cat > job.yaml << 'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB_NAME}
            namespace: ${K8S_NAMESPACE}
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: smoke
              spec:
                # Restricted — pod-level security posture
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65532
                  runAsGroup: 65532
                  seccompProfile:
                    type: RuntimeDefault
                restartPolicy: Never
                containers:
                  - name: curl
                    image: curlimages/curl:8.7.1
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    args:
                      - /bin/sh
                      - -c
                      - |
                        set -e
                        echo "Probing service at http://${APP_SERVICE_NAME}..."
                        ok=""
                        for i in $(seq 1 30); do
                          if curl -fsS --max-time 2 "http://${APP_SERVICE_NAME}/api/v1/healthz" > /dev/null; then
                            echo "healthz OK on attempt $i"
                            ok="yes"
                            break
                          fi
                          sleep 2
                        done
                        [ -n "$ok" ] || { echo "healthz probe failed"; exit 1; }

                        # brief functional check
                        curl -fsS --max-time 5 "http://${APP_SERVICE_NAME}/api/v1/targets" | head -c 200 > /dev/null
                        echo "Smoke test completed."
          YAML

          envsubst < job.yaml | kubectl apply -f -
          kubectl wait \
            --for=condition=complete \
            job/"${JOB_NAME}" \
            -n "${K8S_NAMESPACE}" \
            --timeout=90s

      - name: Show Service & Ingress
        if: always()
        run: |
          kubectl get svc,ing -n ${{ env.K8S_NAMESPACE }} -o wide

      - name: Rollback on Smoke Test Failure
        if: failure() && steps.smoketest.outcome == 'failure'
        env:
          NS: ${{ env.K8S_NAMESPACE }}
          RELEASE: ${{ env.HELM_RELEASE }}
        run: |
          set +e
          echo "Smoke test failed — dumping logs and attempting rollback..."
          kubectl logs -l job-name="csf-smoke-${{ github.run_id }}" -n "${NS}" --tail=-1 || true
          PREV=$(helm history "${RELEASE}" -n "${NS}" --output json | jq '.[-2].revision' -r 2>/dev/null)
          if [ -n "${PREV}" ] && [ "${PREV}" != "null" ]; then
            echo "Rolling back ${RELEASE} to revision ${PREV}"
            helm rollback "${RELEASE}" "${PREV}" -n "${NS}"
          else
            echo "No previous revision found; skipping rollback."
          fi
          exit 1

name: CD - Deploy to EKS

on:
  workflow_call:
    inputs:
      deploy_env:
        description: "Target environment (dev|prod)"
        required: true
        type: string
      app_namespace:
        description: "Kubernetes namespace"
        required: false
        type: string
        default: csf
      helm_release:
        description: "Helm release name"
        required: false
        type: string
        default: csf
      helm_chart_dir:
        description: "Path to Helm chart"
        required: false
        type: string
        default: ./helm
      # Canary controls
      canary_enabled:
        description: "Enable canary (true|false)"
        required: false
        type: string
        default: "false"
      canary_weight:
        description: "Canary traffic weight 0-100"
        required: false
        type: string
        default: "10"
      canary_image_tag:
        description: "Override tag for canary image (defaults to built IMAGE_TAG)"
        required: false
        type: string
        default: ""
      # Allow prod deploy from branch (testing only)
      force_prod:
        description: "Force prod environment even if not main/tag"
        required: false
        type: string
        default: "false"
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: true
      AWS_REGION:
        required: true
      EKS_CLUSTER_NAME:
        required: true
      ECR_REGISTRY:
        required: false
      APP_DOMAIN:
        required: false
      ACM_CERT_ARN:
        required: false

permissions:
  contents: read
  id-token: write

env:
  K8S_NAMESPACE: ${{ inputs.app_namespace }}
  HELM_RELEASE: ${{ inputs.helm_release }}
  HELM_CHART_DIR: ${{ inputs.helm_chart_dir }}

  # Helm default fullname: "<release>-<chartName>" -> "csf-cs-fundamentals"
  APP_DEPLOYMENT_NAME: csf-cs-fundamentals
  APP_SERVICE_NAME: csf-cs-fundamentals

  # Prod routing (only used when DEPLOY_ENV=prod)
  APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
  ACM_CERT_ARN: ${{ secrets.ACM_CERT_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Respect caller env or force_prod in the UI
    environment: ${{ (inputs.force_prod == 'true' && 'prod') || (inputs.deploy_env == 'prod' && 'prod') || 'dev' }}

    steps:
      - name: Checkout Repo at Built SHA
        uses: actions/checkout@v4

      - name: Download Built Image Refs from Artifact
        uses: actions/download-artifact@v4
        with:
          name: image-refs

      - name: Load Image Refs into Env
        id: imagerefs
        run: |
          set -Eeuo pipefail
          source image-refs.env || { echo "image-refs.env missing"; exit 1; }

          echo "GHCR_REF=${ghcr_ref:-}"                 >> "$GITHUB_ENV"
          echo "GHCR_LATEST=${ghcr_latest:-}"           >> "$GITHUB_ENV"
          echo "GHCR_VERSION_SHA=${ghcr_version_sha:-}" >> "$GITHUB_ENV"

          echo "ECR_REF=${ecr_ref:-}"                   >> "$GITHUB_ENV"
          echo "ECR_LATEST=${ecr_latest:-}"             >> "$GITHUB_ENV"
          echo "ECR_VERSION_SHA=${ecr_version_sha:-}"   >> "$GITHUB_ENV"

          echo "SHA=${sha:-}"                           >> "$GITHUB_ENV"
          echo "VERSION_SHA=${version_sha:-}"           >> "$GITHUB_ENV"

          # Version precedence: version+sha, then version, then raw sha
          IMAGE_TAG="${version_sha}"
          [ -n "${IMAGE_TAG}" ] || { echo "Missing version_sha/version/sha in image-refs"; exit 1; }
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

          if [ -n "${ecr_ref:-}" ]; then
            REGISTRY_REPO="${ecr_ref%:*}"
            REGISTRY="${REGISTRY_REPO%/*}"
            REPO="${REGISTRY_REPO#${REGISTRY}/}"
            echo "ECR_REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
            echo "ECR_REPO=${REPO}"         >> "$GITHUB_ENV"
          fi

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure KubeConfig (EKS)
        env:
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -Eeuo pipefail
          aws eks update-kubeconfig \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}"
          kubectl auth can-i get pods -A

      - name: Ensure namespace exists
        run: |
          set -Eeuo pipefail
          kubectl get ns "${K8S_NAMESPACE}" >/dev/null 2>&1 || \
            kubectl create ns "${K8S_NAMESPACE}"

      - name: Resolve Deploy Target & Canary Flags
        id: cfg
        env:
          CALLER_ENV: ${{ inputs.deploy_env }}
          FORCE_PROD: ${{ inputs.force_prod }}
          CANARY_ENABLED_IN: ${{ inputs.canary_enabled }}
          CANARY_WEIGHT_IN: ${{ inputs.canary_weight }}
          CANARY_IMAGE_TAG_IN: ${{ inputs.canary_image_tag }}
        run: |
          set -Eeuo pipefail
          # Effective environment: force_prod overrides
          if [ "${FORCE_PROD}" = "true" ]; then
            DEPLOY_ENV="prod"
          else
            DEPLOY_ENV="${CALLER_ENV}"
          fi
          echo "deploy_env=${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"

          # Normalize canary enabled flag
          CANARY_ENABLED=$(echo "${CANARY_ENABLED_IN}" | tr '[:upper:]' '[:lower:]')
          [ "${CANARY_ENABLED}" = "true" ] || CANARY_ENABLED="false"
          echo "canary_enabled=${CANARY_ENABLED}" >> "$GITHUB_OUTPUT"

          # Treat canary_weight as 0..100
          W="${CANARY_WEIGHT_IN:-0}"
          if [ "${W}" -lt 0 ] || [ "${W}" -gt 100 ]; then
            echo "Invalid canary_weight=${W}; must be 0..100"
            exit 1
          fi
          echo "canary_weight=${W}" >> "$GITHUB_OUTPUT"

          if [ "${W}" -eq 100 ]; then
            FULL_PROMOTION="true"
          else
            FULL_PROMOTION="false"
          fi
          echo "canary_full_promotion=${FULL_PROMOTION}" >> "$GITHUB_OUTPUT"

          # Canary image tag defaults to built IMAGE_TAG
          echo "canary_image_tag=${CANARY_IMAGE_TAG_IN:-$IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Helm Upgrade (Stage deploy)
        id: stage
        env:
          FALLBACK_ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          DEPLOY_ENV: ${{ steps.cfg.outputs.deploy_env }}
          CANARY_ENABLED: ${{ steps.cfg.outputs.canary_enabled }}
          CANARY_IMAGE_TAG: ${{ steps.cfg.outputs.canary_image_tag }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}
          HELM_RELEASE: ${{ env.HELM_RELEASE }}
          HELM_CHART_DIR: ${{ env.HELM_CHART_DIR }}
          APP_DEPLOYMENT_NAME: ${{ env.APP_DEPLOYMENT_NAME }}
          APP_DOMAIN: ${{ env.APP_DOMAIN }}
          ACM_CERT_ARN: ${{ env.ACM_CERT_ARN }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPO: ${{ env.ECR_REPO }}
        run: |
          set -Eeuo pipefail

          REGISTRY="${ECR_REGISTRY:-$FALLBACK_ECR_REGISTRY}"
          REPO="${ECR_REPO:-cs-fundamentals}"
          [ -n "${REGISTRY}" ] || { echo "No ECR registry configured"; exit 1; }
          [ -n "${IMAGE_TAG}" ] || { echo "IMAGE_TAG not set"; exit 1; }

          IMAGE_REPO="${REGISTRY}/${REPO}"
          echo "Registry: ${IMAGE_REPO}"
          echo "Deploy env: ${DEPLOY_ENV}"
          echo "Canary enabled: ${CANARY_ENABLED}"

          # Base helm args
          HELM_ARGS=(
            upgrade --install "${HELM_RELEASE}" "${HELM_CHART_DIR}"
            --namespace "${K8S_NAMESPACE}"
            --create-namespace
            -f "${HELM_CHART_DIR}/values.yaml"
            --set image.repository="${IMAGE_REPO}"
            --set serviceAccount.create=false
          )

          # Prod ingress wiring
          if [ "${DEPLOY_ENV}" = "prod" ]; then
            [ -n "${APP_DOMAIN:-}" ] && [ -n "${ACM_CERT_ARN:-}" ] || {
              echo "APP_DOMAIN/ACM_CERT_ARN missing for prod"; exit 1;
            }
            HELM_ARGS+=(
              -f "${HELM_CHART_DIR}/values-prod.yaml"
              --set ingress.enabled=true
              --set ingress.className=alb
              --set ingress.hosts[0].host="${APP_DOMAIN}"
              --set ingress.hosts[0].paths[0].path="/"
              --set ingress.hosts[0].paths[0].pathType=Prefix
              --set-string ingress.annotations."alb\.ingress\.kubernetes\.io\/scheme"="internet-facing"
              --set-string ingress.annotations."alb\.ingress\.kubernetes\.io\/target-type"="ip"
              --set-string ingress.annotations."alb\.ingress\.kubernetes\.io\/healthcheck-path"="/api/v1/healthz"
              --set-string ingress.annotations."alb\.ingress\.kubernetes\.io\/certificate-arn"="${ACM_CERT_ARN}"
            )
          fi

          if [ "${DEPLOY_ENV}" = "prod" ] && [ "${CANARY_ENABLED}" = "true" ]; then
            echo "Running CANARY STAGE deploy (prod) with weight=0 (no live traffic)"

            # Detect current STABLE image tag to avoid touching it
            CURRENT_IMAGE=$(kubectl -n "${K8S_NAMESPACE}" get deploy "${APP_DEPLOYMENT_NAME}" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            if [ -z "${CURRENT_IMAGE}" ]; then
              echo "No existing stable deployment found - falling back to NORMAL deploy."
              HELM_ARGS+=( --set image.tag="${IMAGE_TAG}" --set canary.enabled=false )
            else
              CURRENT_TAG="${CURRENT_IMAGE##*:}"
              echo "Stable currently running tag: ${CURRENT_TAG}"

              HELM_ARGS+=(
                --set image.tag="${CURRENT_TAG}"
                --set canary.enabled=true
                --set canary.image.repository="${IMAGE_REPO}"
                --set canary.image.tag="${CANARY_IMAGE_TAG}"
                --set canary.weight=0
              )
            fi
          else
            echo "Running NORMAL deploy (set stable to new image, canary disabled)"
            HELM_ARGS+=( --set image.tag="${IMAGE_TAG}" --set canary.enabled=false )
          fi

          helm "${HELM_ARGS[@]}"

      - name: Wait for rollout (stable)
        env:
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}
          APP_DEPLOYMENT_NAME: ${{ env.APP_DEPLOYMENT_NAME }}
        run: |
          set -Eeuo pipefail
          kubectl rollout status deploy/${APP_DEPLOYMENT_NAME} \
            -n "${K8S_NAMESPACE}" --timeout=180s
          kubectl get pods -n "${K8S_NAMESPACE}" -o wide

      - name: Wait for rollout (canary - if staged)
        if: ${{ steps.cfg.outputs.canary_enabled == 'true' && steps.cfg.outputs.deploy_env == 'prod' }}
        env:
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}
          APP_DEPLOYMENT_NAME: ${{ env.APP_DEPLOYMENT_NAME }}
        run: |
          set -Eeuo pipefail
          if kubectl get deploy/${APP_DEPLOYMENT_NAME}-canary -n "${K8S_NAMESPACE}" >/dev/null 2>&1; then
            kubectl rollout status deploy/${APP_DEPLOYMENT_NAME}-canary \
              -n "${K8S_NAMESPACE}" --timeout=180s
            kubectl get deploy,svc,ing -n "${K8S_NAMESPACE}" -o wide
          else
            echo "No canary Deployment present - skipping canary rollout wait."
          fi

      - name: Smoke test canary (in-cluster)
        if: ${{ steps.cfg.outputs.canary_enabled == 'true' && steps.cfg.outputs.deploy_env == 'prod' }}
        env:
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}
          APP_SERVICE_NAME: ${{ env.APP_SERVICE_NAME }}
          HELM_RELEASE: ${{ env.HELM_RELEASE }}
          HELM_CHART_DIR: ${{ env.HELM_CHART_DIR }}
        run: |
          set -Eeuo pipefail
          echo "Running canary smoke test via Service ${APP_SERVICE_NAME}-canary..."

          # Clean up any old pod from previous runs
          kubectl -n "${K8S_NAMESPACE}" delete pod canary-smoke --ignore-not-found || true

          # Create a Pod configured to satisfy PodSecurity "restricted"
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: canary-smoke
            namespace: ${K8S_NAMESPACE}
          spec:
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: canary-smoke
                image: curlimages/curl:8.7.1
                securityContext:
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                  capabilities:
                    drop: ["ALL"]
                command: ["sh", "-c"]
                args:
                  - |
                    for i in 1 2 3; do
                      curl -fsS http://${APP_SERVICE_NAME}-canary/api/v1/healthz && exit 0 || sleep 3
                    done
                    exit 1
          EOF

          # Wait for the pod to finish
          for i in {1..30}; do
            STATUS=$(kubectl -n "${K8S_NAMESPACE}" get pod canary-smoke -o jsonpath='{.status.phase}' 2>/dev/null || echo "Pending")
            echo "canary-smoke status: ${STATUS}"
            if [ "${STATUS}" = "Succeeded" ] || [ "${STATUS}" = "Failed" ]; then
              break
            fi
            sleep 2
          done

          STATUS=$(kubectl -n "${K8S_NAMESPACE}" get pod canary-smoke -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
          if [ "${STATUS}" != "Succeeded" ]; then
            echo "Canary smoke test FAILED (pod phase=${STATUS})"
            kubectl -n "${K8S_NAMESPACE}" logs canary-smoke || true
            helm upgrade "${HELM_RELEASE}" "${HELM_CHART_DIR}" \
              --namespace "${K8S_NAMESPACE}" \
              --reuse-values \
              --set canary.enabled=false \
              --set canary.replicas=0
            kubectl -n "${K8S_NAMESPACE}" delete pod canary-smoke --ignore-not-found || true
            exit 1
          fi

          echo "Canary smoke test PASSED"
          kubectl -n "${K8S_NAMESPACE}" delete pod canary-smoke --ignore-not-found || true

      - name: Promote canary / cutover traffic
        if: ${{ steps.cfg.outputs.canary_enabled == 'true' && steps.cfg.outputs.deploy_env == 'prod' }}
        env:
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}
          HELM_RELEASE: ${{ env.HELM_RELEASE }}
          HELM_CHART_DIR: ${{ env.HELM_CHART_DIR }}
          CANARY_WEIGHT: ${{ steps.cfg.outputs.canary_weight }}
          CANARY_FULL_PROMOTION: ${{ steps.cfg.outputs.canary_full_promotion }}
          CANARY_IMAGE_TAG: ${{ steps.cfg.outputs.canary_image_tag }}
        run: |
          set -Eeuo pipefail
          W="${CANARY_WEIGHT}"

          if [ "${W}" -eq 0 ]; then
            echo "Canary is healthy and staged at 0% traffic. Skipping auto-promotion (manual promotion required or run with canary_weight>0)."
            exit 0
          fi

          if [ "${CANARY_FULL_PROMOTION}" = "true" ]; then
            echo "Promoting canary (${CANARY_IMAGE_TAG}) to STABLE and disabling canary..."
            helm upgrade "${HELM_RELEASE}" "${HELM_CHART_DIR}" \
              --namespace "${K8S_NAMESPACE}" \
              --reuse-values \
              --set image.tag="${CANARY_IMAGE_TAG}" \
              --set canary.enabled=false \
              --set canary.replicas=0
            exit 0
          fi

          echo "Enabling weighted canary traffic: ${W}% via ALB actions"
          helm upgrade "${HELM_RELEASE}" "${HELM_CHART_DIR}" \
            --namespace "${K8S_NAMESPACE}" \
            --reuse-values \
            --set canary.enabled=true \
            --set canary.weight="${W}"

      - name: Show Service & Ingress
        if: always()
        env:
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}
        run: |
          set -Eeuo pipefail
          kubectl get svc,ing -n "${K8S_NAMESPACE}" -o wide

# This workflow will install Python dependencies, lint/format, and run tests with a Python version matrix
# After lint/tests succeed, we conditionally call the reusable build workflow for pushes to main or version tags.

name: Automation - Lint/Tests

on:
  push:
  pull_request:
    types: [ opened, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-Commit Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4

      - name: Install Deps
        shell: bash
        # Sync dev dependencies and fail CI if drift between pyproject.toml and uv.lock
        run: |
          uv sync --frozen --only-dev

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  mypy:
    name: Type Checks (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.11'

      - name: Install Deps (including dev)
        shell: bash
        run: |
          uv sync --frozen --all-groups

      - name: Type check
        shell: bash
        run: |
          uv run --frozen mypy cs_fundamentals

  semgrep:
    name: Semgrep (Static Application Security Testing - SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.13'

      - name: Install Semgrep
        run: pip install semgrep==1.36.0

      - name: Run Semgrep scan
        run: semgrep ci --config p/ci --config p/security-audit --sarif --output semgrep.sarif

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  osv:
    name: OSV Scanner (Dependency Analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action@v2.2.3
        with:
          scan-args: >-
            --recursive
            --lockfile
            .
          github-token: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Trivy (File System Analysis - Vulnerabilities/Secrets/Licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          vuln-type: 'os,library'
          scanners: 'vuln,secret,license'
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignorefile: .trivyignore
          license-policy: trivy-license-policy.yaml
          license-full: true

  pytest:
    name: Pytest ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
    continue-on-error: ${{ matrix.python-version != '3.11' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Deps
        shell: bash
        # Sync default dependencies and fail CI if drift between pyproject.toml and uv.lock
        run: |
          uv sync --frozen --all-groups

      - name: Run Tests
        shell: bash
        run: |
          uv run --frozen pytest

  # After lint and tests pass, call the reusable build workflow.
  build-and-push:
    name: Build, Scan & Push
    needs: [pre-commit, mypy, pytest, semgrep, osv, trivy-fs]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/build.yaml
    # Inherit repo secrets (GITHUB_TOKEN) for GHCR login/push inside the called workflow
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write

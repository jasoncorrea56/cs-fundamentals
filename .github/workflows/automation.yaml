# This workflow will install Python dependencies, lint/format, and run tests with a Python version matrix
# After lint/tests succeed, we conditionally call the reusable build workflow for pushes to main or version tags.

name: Automation - Lint/Tests

on:
  push:
  pull_request:
    types: [ opened, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-Commit Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4

      - name: Install Deps
        shell: bash
        # Sync dev dependencies and fail CI if drift between pyproject.toml and uv.lock
        run: |
          uv sync --frozen --only-dev

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  mypy:
    name: Type Checks (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.11'

      - name: Install Deps (including dev)
        shell: bash
        run: |
          uv sync --frozen --all-groups

      - name: Type check
        shell: bash
        run: |
          uv run --frozen mypy cs_fundamentals

  semgrep:
    name: Semgrep (Static Application Security Testing - SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.13'

      - name: Install Semgrep
        run: pip install "semgrep>=1.86,<2.0"

      # PRs: compare against the merge-base with the target branch
      - name: Run Semgrep (PR diff only)
        if: ${{ github.event_name == 'pull_request' }}
        # Use the PR base SHA as the baseline so only NEW findings fail the job
        run: |
          semgrep ci \
            --verbose \
            --baseline-commit "${{ github.event.pull_request.base.sha }}" \
            --config p/ci \
            --config p/security-audit \
            --config p/python \
            --sarif --output semgrep-python.sarif

      # Pushes: full scan
      - name: Run Semgrep (YAML + Python Full Scan)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          semgrep ci \
            --verbose \
            --config p/ci \
            --config p/security-audit \
            --config p/python \
            --sarif --output semgrep-python.sarif

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-python.sarif
          category: semgrep

  osv-prep:
    name: Export deps for OSV (uv -> requirements)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # Export all groups/extras; drop hashes so OSV treats it as a lock manifest
      - name: Export Requirements from uv.lock
        run: |
          uv export --format=requirements-txt --all-groups --all-extras --no-hashes -o osv-requirements.txt
          test -s osv-requirements.txt || (echo "No deps exported" && exit 1)
      - name: Upload OSV Deps Artifact
        uses: actions/upload-artifact@v4
        with:
          name: osv-deps
          path: osv-requirements.txt
          retention-days: 3

  osv:
    name: OSV Scanner (Dependency Analysis)
    needs: [osv-prep]
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.2.3
    with:
      download-artifact: osv-deps
      # Tell OSV what the file is (left side = lockfile type, right side = filename inside artifact)
      scan-args: |-
        --lockfile=requirements.txt:osv-requirements.txt
        --include-git-root
        ./
      upload-sarif: true  # default true; explicit for clarity
      fail-on-vuln: true  # default true; explicit for clarity

  trivy-fs:
    name: Trivy (File System Analysis - Vulnerabilities/Secrets/Licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          vuln-type: 'os,library'
          scanners: 'vuln,secret,license'
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignorefile: .trivyignore
          license-policy: trivy-license-policy.yaml
          license-full: true

  pytest:
    name: Pytest ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
    continue-on-error: ${{ matrix.python-version != '3.11' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Deps
        shell: bash
        # Sync default dependencies and fail CI if drift between pyproject.toml and uv.lock
        run: |
          uv sync --frozen --all-groups

      - name: Run Tests
        shell: bash
        run: |
          uv run --frozen pytest

  # After lint and tests pass, call the reusable build workflow.
  build-and-push:
    name: Build, Scan & Push
    needs: [pre-commit, mypy, pytest, semgrep, osv, trivy-fs]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/build.yaml
    # Inherit repo secrets (GITHUB_TOKEN) for GHCR login/push inside the called workflow
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write

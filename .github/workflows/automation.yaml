# This workflow will install Python dependencies, lint/format, and run tests with a Python version matrix
# After lint/tests succeed, we conditionally call the reusable build workflow for pushes to main or version tags.

name: Automation - Lint/Tests

on:
  push:
  pull_request:
    types: [ opened, synchronize ]

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4

      - name: Install Deps
        shell: bash
        # Sync dev dependencies and fail CI if drift between pyproject.toml and uv.lock
        run: |
          uv sync --frozen --only-dev

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  pytest:
    name: pytest ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]
    continue-on-error: ${{ matrix.python-version != '3.11' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Deps
        shell: bash
        # Sync default dependencies and fail CI if drift between pyproject.toml and uv.lock
        run: |
          uv sync --frozen --all-groups

      - name: Run Tests
        shell: bash
        run: |
          uv run --frozen pytest

  # After lint and tests pass, call the reusable build workflow.
  build-and-push:
    name: build (reusable)
    needs: [pre-commit, pytest]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/build.yaml
    # Inherit repo secrets (GITHUB_TOKEN) for GHCR login/push inside the called workflow
    secrets: inherit
    permissions:
      contents: read
      packages: write

# This workflow will install Python dependencies, lint/format, and run tests with a Python version matrix
# After lint/tests succeed, we conditionally call the reusable build workflow for pushes to main or version tags.

name: Automation - Lint/Scan/Test

on:
  push:
    branches: [ '**' ]  # TODO UNDO [ main ]  # Merge to main
    tags:    [ 'v*', 'release-*' ]
  pull_request:
    branches: [ main ]  # PR targeting main
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-Commit Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.11.13'
          enable-cache: true

      - name: Install Deps
        shell: bash
        # Sync dev deps and fail CI on drift between pyproject.toml and uv.lock
        run: |
          uv sync --frozen --only-dev

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  pytest:
    name: Pytest ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11.13', '3.12', '3.13' ]
    continue-on-error: ${{ matrix.python-version != '3.11' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Deps
        shell: bash
        # Sync default dependencies and fail CI if drift between pyproject.toml and uv.lock
        run: |
          uv sync --frozen --all-groups

      - name: Run Tests
        shell: bash
        run: |
          uv run --frozen pytest

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure baseline commit is available for PRs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.13'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install "semgrep==1.86.0"
          semgrep --version
          python --version

      - name: Build Semgrep flags (PR baseline or full scan)
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo 'SEMGREP_BASE=--metrics=off --baseline-commit ${{ github.event.pull_request.base.sha }}' >> "$GITHUB_ENV"
          else
            echo 'SEMGREP_BASE=--metrics=off' >> "$GITHUB_ENV"
          fi
          # Include local override config first
          echo 'SEMGREP_CONFIGS=--config .semgrep.yaml --config p/ci --config p/security-audit --config p/python' >> "$GITHUB_ENV"

      - name: Semgrep Code Vuln Scan - Gated
        shell: bash
        run: |
          # shellcheck disable=SC2086
          semgrep ci $SEMGREP_BASE $SEMGREP_CONFIGS \
            --json --output semgrep.json

      - name: Semgrep Code SARIF Scan - Upload Only (Audit)
        shell: bash
        run: |
          # shellcheck disable=SC2086
          semgrep ci $SEMGREP_BASE $SEMGREP_CONFIGS \
            --sarif --output semgrep-python.sarif || true

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-python.sarif
          category: semgrep

  osv-prep:
    name: Export deps for OSV (uv -> requirements)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.11.13'
          enable-cache: true
      # Export all groups/extras; drop hashes so OSV treats it as a lock manifest
      - name: Export Requirements from uv.lock
        run: |
          uv export --format=requirements-txt --all-groups --all-extras --no-hashes -o osv-requirements.txt
          test -s osv-requirements.txt || (echo "No deps exported" && exit 1)
      - name: Upload OSV Deps Artifact
        uses: actions/upload-artifact@v4
        with:
          name: osv-deps
          path: osv-requirements.txt
          retention-days: 3

  osv:
    name: OSV Scanner (Dependency Analysis)
    needs: [osv-prep]
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.2.3
    with:
      download-artifact: osv-deps
      # Tell OSV what the file is (left side = lockfile type, right side = filename inside artifact)
      scan-args: |-
        --lockfile=requirements.txt:osv-requirements.txt
        --include-git-root
        ./
      upload-sarif: true  # Default - explicit for clarity
      fail-on-vuln: true  # Default - explicit for clarity

  trivy-fs:
    name: Trivy (File System Analysis - Vulnerabilities/Secrets/Licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          vuln-type: 'os,library'
          scanners: 'vuln,secret,license'
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: .trivyignore
          license-policy: trivy-license-policy.yaml
          license-full: true

  # After lint and tests pass, call the reusable build workflow.
  build-and-push:
    name: Build, Scan & Push
    needs: [pre-commit, pytest, semgrep, osv, trivy-fs]
    if: |
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/heads/main')
        || startsWith(github.ref, 'refs/tags/v')
        || startsWith(github.ref, 'refs/heads/add-cd')
      )
    uses: ./.github/workflows/build.yaml
    with:
      push_latest: ${{ startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write

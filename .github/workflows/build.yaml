# CHANGE: This workflow is now reusable (workflow_call) and ONLY handles build & push.
# It can still be invoked directly if you want by adding push triggers back,
# but the DRY pattern is to call it from automation.yaml after lint/tests pass.

name: Build

on:
  workflow_call:
    inputs:
      image_name:
        description: "Target image name (registry/repo/name)"
        required: false
        type: string
        default: ghcr.io/${{ github.repository_owner }}/cs-fundamentals
      push_latest:
        description: "Also tag and push :latest"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write   # required to push to GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Set Metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Always push the SHA tag - :latest is optional based on input
          tags: |
            ${{ inputs.image_name }}:${{ steps.meta.outputs.sha }}
            ${{ inputs.image_name }}${{ inputs.push_latest && ':latest' || '' }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
            BUILD_TIME=${{ steps.meta.outputs.created }}

  smoke-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Run container
        run: |
          docker run -d --rm -p 8000:8000 --name csfund ghcr.io/${{ github.repository_owner }}/cs-fundamentals:latest
          for i in {1..20}; do
            sleep 1
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null; then exit 0; fi
          done
          docker logs csfund || true
          exit 1

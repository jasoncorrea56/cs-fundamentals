# This reusable workflow handles building a runtime Docker image & pushing to GHCR.
# It is called from automation.yaml after lint/tests pass.

name: Build

on:
  workflow_call:
    inputs:
      image_name:
        description: "Target image name (registry/repo/name)"
        required: false
        type: string
        default: ghcr.io/${{ github.repository_owner }}/cs-fundamentals
      push_latest:
        description: "Also tag and push :latest"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write   # required to push to GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ inputs.image_name }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Set Metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Always push the SHA tag - :latest is optional based on input
          tags: |
            ${{ inputs.image_name }}:${{ steps.meta.outputs.sha }}
            ${{ inputs.image_name }}${{ inputs.push_latest && ':latest' || '' }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
            BUILD_TIME=${{ steps.meta.outputs.created }}

  smoke-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run container and probe /healthz
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image_name }}"
          TAG="${{ needs.build-and-push.outputs.sha }}"
          docker run -d --rm -p 18080:8000 --name app "${IMAGE}:${TAG}"
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/api/v1/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "healthz not ready"
          docker logs app || true
          exit 1
      - name: Stop container
        if: always()
        run: docker stop app || true

  admin-test:
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run admin health task
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image_name }}"
          TAG="${{ needs.build-and-push.outputs.sha }}"
          docker run --rm --entrypoint python "${IMAGE}:${TAG}" -m cs_fundamentals.admin health

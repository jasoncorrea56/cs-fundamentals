name: Release - Version & Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: google-github-actions/release-please-action@v4
        with:
          package-name: cs-fundamentals
          release-type: python
          extra-files: |
            pyproject.toml
            helm/Chart.yaml
            helm/values.yaml

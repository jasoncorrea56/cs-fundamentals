image:
  repository: ghcr.io/jasoncorrea56/cs-fundamentals
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 2

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

probes:
  path: /api/v1/healthz
  timeoutSeconds: 2
  periodSeconds: 10
  failureThreshold: 3
  successThreshold: 1
  initialDelaySeconds: 5

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: cs-fundamentals.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

env:
  - name: LOG_LEVEL
    value: "info"
  # - name: SOME_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: {{ include "cs-fundamentals.fullname" . }}-secret
  #       key: someApiKey

config:
  enabled: true
  mountPath: /app/config
  data:
    APP_NAME: cs-fundamentals
    FEATURE_FLAG_EXAMPLE: "false"

# Base64-encoded values can be provided via extraManifests or directly with stringData
secret:
  enabled: false
  stringData: {}

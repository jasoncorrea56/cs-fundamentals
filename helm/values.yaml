image:
  repository: 948319129176.dkr.ecr.us-west-2.amazonaws.com/cs-fundamentals
  tag: 0.7.2
  pullPolicy: IfNotPresent
  fullname: ''
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
replicaCount: 2
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}
probes:
  path: /api/v1/healthz
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  startup:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 12
ingress:
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80,"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
  hosts: []
  tls: {}
serviceAccount:
  create: true
  name: csf-app
  annotations: {}
podAnnotations: {}
podLabels: {}
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
pdb:
  enabled: true
  maxUnavailable: 1
nodeSelector: {}
tolerations: []
affinity: {}
env:
  - name: LOG_LEVEL
    value: info
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: csf-db
        key: DB_URL
config:
  enabled: true
  mountPath: /app/config
  data:
    APP_NAME: cs-fundamentals
    FEATURE_FLAG_EXAMPLE: 'false'
secret:
  enabled: false
  stringData: {}
secretsStore:
  enabled: false
  spcName: csf-db-spc
  mountPath: /mnt/secrets-store
podSecurityContext:
  fsGroup: 2000
  runAsNonRoot: true
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
devWritableTmp:
  enabled: true
canary:
  enabled: false
  replicas: 1
  weight: 10
  nameSuffix: canary
  image:
    repository: ''
    tag: ''
  env: []
  podLabels: {}
  podAnnotations: {}

{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cs-fundamentals.fullname" . }}
  labels:
    {{- include "cs-fundamentals.labels" . | nindent 4 }}
spec:
  {{- /* Prefer maxUnavailable for small replica sets and HPA friendliness.
        Fallback to minAvailable if maxUnavailable not provided. */ -}}
  {{- if hasKey .Values.pdb "maxUnavailable" }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.pdb.minAvailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cs-fundamentals.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{- if .Values.ingress.enabled }}

{{- $hosts := .Values.ingress.hosts | default (list) }}
{{- if not (and (gt (len $hosts) 0) (hasKey (index $hosts 0) "host") (ne (index $hosts 0).host "")) }}
{{- fail "ingress.enabled=true but ingress.hosts[0].host is not set" }}
{{- end }}

{{- $canaryEnabled := default false .Values.canary.enabled }}
{{- $canaryWeight := int (default 0 .Values.canary.weight) }}
{{- $useWeighted := and $canaryEnabled (gt $canaryWeight 0) (le $canaryWeight 100) }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cs-fundamentals.fullname" . }}
  labels:
    {{- include "cs-fundamentals.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.sslRedirectEnabled }}
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    {{- end }}
    {{- end }}
    {{- if $useWeighted }}
    alb.ingress.kubernetes.io/actions.csf-weighted: >
      {"Type":"forward","ForwardConfig":{"TargetGroups":[
        {"ServiceName":"{{ include "cs-fundamentals.fullname" . }}","ServicePort":"{{ .Values.service.port }}","Weight":{{ max (sub 100 $canaryWeight) 0 }}},
        {"ServiceName":"{{ include "cs-fundamentals.canary.fullname" . }}","ServicePort":"{{ .Values.service.port }}","Weight":{{ $canaryWeight }}}
      ]}}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              {{- if $useWeighted }}
              # Weighted split between stable and canary via ALB action.
              service:
                name: csf-weighted
                port:
                  name: use-annotation
              {{- else }}
              # Default: all traffic to stable service.
              service:
                name: {{ include "cs-fundamentals.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}

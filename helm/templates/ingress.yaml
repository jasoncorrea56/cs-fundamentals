{{- if .Values.ingress.enabled }}
{{- $hosts := .Values.ingress.hosts | default (list) }}
{{- if not (and (gt (len $hosts) 0) (hasKey (index $hosts 0) "host") (ne (index $hosts 0).host "")) }}
{{- fail "ingress.enabled=true but ingress.hosts[0].host is not set" }}
{{- end }}

{{- $canaryEnabled := (default false .Values.canary.enabled) -}}
{{- $weight := int (default 0 .Values.canary.weight) -}}
{{- if or (lt $weight 0) (gt $weight 100) }}
{{- fail (printf "canary.weight=%d is invalid; must be between 0 and 100" $weight) }}
{{- end }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cs-fundamentals.fullname" . }}
  labels:
    {{- include "cs-fundamentals.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $canaryEnabled }}
    alb.ingress.kubernetes.io/actions.csf-weighted: >
      {"Type":"forward","ForwardConfig":{"TargetGroups":[
        {"ServiceName":"{{ include "cs-fundamentals.fullname" . }}","ServicePort":"{{ .Values.service.port }}","Weight":{{ sub 100 $weight }}},
        {"ServiceName":"{{ include "cs-fundamentals.canary.fullname" . }}","ServicePort":"{{ .Values.service.port }}","Weight":{{ $weight }}}
      ]}}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              {{- if $canaryEnabled }}
              # When canary is enabled, always go through the ALB weighted action.
              service:
                name: csf-weighted
                port:
                  name: use-annotation
              {{- else }}
              # Default: all traffic to stable service.
              service:
                name: {{ include "cs-fundamentals.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
              {{- end }}
          {{- end }}
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}

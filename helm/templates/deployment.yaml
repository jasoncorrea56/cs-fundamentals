{{- /* local flags (safe even if values are missing) */ -}}
{{- $useSecrets := (default false .Values.secretsStore.enabled) -}}
{{- $useTmp := (default false .Values.devWritableTmp.enabled) -}}

{{- /* rollout strategy locals (nil-safe & IDE-friendly) */ -}}
{{- $strategy := (default (dict) (get .Values "strategy")) -}}
{{- $rolling := (default (dict) (index $strategy "rollingUpdate")) -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cs-fundamentals.fullname" . }}
  labels:
    {{- include "cs-fundamentals.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ default "25%" (index $rolling "maxSurge") }}
      maxUnavailable: {{ default 0 (index $rolling "maxUnavailable") }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cs-fundamentals.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "cs-fundamentals.labels" . | nindent 8 }}
        track: "stable"
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: app
          # Deterministic image selection: always repo:tag (not fullname).
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}

          {{- if or .Values.env $useTmp }}
          env:
            - name: CSF_IMAGE_TAG
              value: "{{ .Values.image.tag | default .Chart.AppVersion }}"
            {{- if .Values.env }}
            {{- toYaml .Values.env | nindent 12 }}
            {{- end }}
            {{- if $useTmp }}
            - name: TMPDIR
              value: /tmp
            {{- end }}
          {{- end }}

          {{- if or .Values.config.enabled .Values.secret.enabled }}
          envFrom:
            {{- if .Values.config.enabled }}
            - configMapRef:
                name: {{ include "cs-fundamentals.fullname" . }}
            {{- end }}
            {{- if .Values.secret.enabled }}
            - secretRef:
                name: {{ include "cs-fundamentals.fullname" . }}-secret
            {{- end }}
          {{- end }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            successThreshold: {{ .Values.probes.liveness.successThreshold }}

          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- if or $useSecrets $useTmp }}
          volumeMounts:
            {{- if $useSecrets }}
            - name: secrets-store
              mountPath: {{ .Values.secretsStore.mountPath | default "/mnt/secrets-store" | quote }}
              readOnly: true
            {{- end }}
            {{- if $useTmp }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
          {{- end }}

          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if or $useSecrets $useTmp }}
      volumes:
        {{- if $useSecrets }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.secretsStore.spcName | default "csf-db-spc" | quote }}
        {{- end }}
        {{- if $useTmp }}
        - name: tmp
          emptyDir: {}
        {{- end }}
      {{- end }}

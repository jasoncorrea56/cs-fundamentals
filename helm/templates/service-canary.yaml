{{- if .Values.canary.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cs-fundamentals.canary.fullname" . }}
  labels:
    {{- include "cs-fundamentals.labels" . | nindent 4 }}
    canary: "true"
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "cs-fundamentals.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    canary: "true"
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
{{- end }}

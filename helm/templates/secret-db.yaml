{{- if and .Values.secret.enabled (not .Values.secret.external) }}
{{- $data := .Values.secret.data | default dict }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name | default (printf "%s-db" (include "cs-fundamentals.fullname" .)) }}
  labels:
    {{- include "cs-fundamentals.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- end }}

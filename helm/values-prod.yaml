replicaCount: 2

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/healthz
    # Tag the ALB so Terraform can auto-discover it for alarms.
    alb.ingress.kubernetes.io/tags: "Environment=prod,Service=cs-fundamentals"
  hosts:
    - host: placeholder.invalid   # Real host comes from deploy.yaml or Terraform
      paths:
        - path: /
          pathType: Prefix

serviceAccount:
  create: false  # TF creates SA with IRSA (secret_sync module)
  name: csf-app

secretsStore:
  enabled: true
  spcName: csf-db-spc  # Match TF secret_sync.spc_name
  mountPath: /mnt/secrets-store

# DB_URL comes from the synced K8s Secret made by the CSI driver
env:
  - name: LOG_LEVEL
    value: "WARNING"
  - name: LOG_FORMAT
    value: "json"
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: csf-db
        key: DB_URL

# Harden container FS for prod
containerSecurityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# Keep a tmp dir available (read-only root FS needs it)
devWritableTmp:
  enabled: true

# Non-secret app config (aligns with pydantic env names)
config:
  enabled: true
  data:
    APP_NAME: "CS Fundamentals API"
    ENV: "prod"
    PORT: "8080"
    LOG_LEVEL: "INFO"
    LOG_FORMAT: "json"
    WEB_CONCURRENCY: "2"
    GRACEFUL_TIMEOUT: "30"

pdb:
  enabled: true
  maxUnavailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

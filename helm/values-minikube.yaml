replicaCount: 1

image:
  # Use the locally built image name (no registry)
  repository: cs-fundamentals
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: csf-app-dev  # Dev-only SA to avoid collision with prod IRSA-owned SA

# Disable AWS Secrets Store CSI for minikube
secretsStore:
  enabled: false

# Dev uses a simple K8s Secret for DB_URL, but we DO NOT commit any values here.
# The Secret is created by `make dev-secret` from a local, gitignored env file.
# This chart will *reference* that Secret.
secret:
  enabled: false       # Helm will NOT create the Secret (we create it via Makefile)
  name: csf-db-dev     # Dev-only Secret name (created by Makefile target)
  data: {}             # Intentionally empty - no plaintext in repo
  external: true       # Clarifies intent: provided externally for dev

env:
  - name: LOG_LEVEL
    value: info
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: csf-db-dev
        key: DB_URL

service:
  type: NodePort
  port: 80
  targetPort: 8080

ingress:
  enabled: false  # Use port-forward for local dev
  hosts:
    - host: csf.localtest.me  # Resolves to 127.0.0.1
      paths:
        - path: /
          pathType: Prefix
  tls: {}

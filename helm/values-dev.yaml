image:
  tag: 0.7.2-30b48fa

replicaCount: 1

ingress:
  enabled: true
  className: alb
  certificateArn: ""
  sslRedirectEnabled: false
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/healthz
    # Dev: HTTP-only (no ACM / TLS)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # Tag the ALB so Terraform can auto-discover it for alarms.
    alb.ingress.kubernetes.io/tags: "Environment=dev,Service=cs-fundamentals"
  hosts:
    - host: csf-dev.dawnforgegaming.com
      paths:
        - path: /
          pathType: Prefix
  listenPorts: '[{"HTTP":80}]'
  tls:
    enabled: false
    acmCertificateArn: ""

serviceAccount:
  create: false  # TF creates SA with IRSA (secret_sync module)
  name: csf-app

secretsStore:
  enabled: false
  spcName: csf-db-spc  # Match TF secret_sync.spc_name
  mountPath: /mnt/secrets-store

# DB_URL comes from the synced K8s Secret made by the CSI driver
env:
  - name: LOG_LEVEL
    value: "WARNING"
  - name: LOG_FORMAT
    value: "json"
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: csf-db
        key: DB_URL

# Harden container FS
containerSecurityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# Keep a tmp dir available (read-only root FS needs it)
devWritableTmp:
  enabled: true

# Non-secret app config (aligns with pydantic env names)
config:
  enabled: true
  data:
    APP_NAME: "CS Fundamentals API"
    ENV: "dev"
    PORT: "8080"
    LOG_LEVEL: "INFO"
    LOG_FORMAT: "json"
    WEB_CONCURRENCY: "2"
    GRACEFUL_TIMEOUT: "30"

pdb:
  enabled: true
  maxUnavailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

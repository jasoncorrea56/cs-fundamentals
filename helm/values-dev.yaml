# Dev overlay applied on top of values.yaml

replicaCount: 1

image:
  # For dev we usually override tag via CI or manually,
  # but this can be a reasonable default:
  tag: 0.7.5

ingress:
  enabled: true
  annotations:
    alb.ingress.kubernetes.io/tags: "Environment=dev,Service=cs-fundamentals"
  hosts:
    - host: csf-dev.jasoncorrea.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true

serviceAccount:
  create: false  # TF creates SA with IRSA (secret_sync module)
  name: csf-app

secretsStore:
  enabled: true
  spcName: csf-db-spc  # Match TF secret_sync.spc_name
  mountPath: /mnt/secrets-store

# DB_URL comes from the synced K8s Secret made by the CSI driver
env:
  - name: LOG_LEVEL
    value: "WARNING"
  - name: LOG_FORMAT
    value: "json"
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: csf-db
        key: DB_URL

config:
  enabled: true
  data:
    APP_NAME: "CS Fundamentals API"
    ENV: "dev"
    PORT: "8080"
    LOG_LEVEL: "INFO"
    LOG_FORMAT: "json"
    WEB_CONCURRENCY: "2"
    GRACEFUL_TIMEOUT: "30"

pdb:
  enabled: true
  maxUnavailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

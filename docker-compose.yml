# Runtime modes:
#   Dev:  hot-reload via bind-mount + uvicorn --reload
#   Prod: runs the built image exactly like production (no mounts, no reload)
#
# Usage:
#   Dev:  docker compose --profile dev up --build
#   Prod: docker compose --profile prod up --build
#
# Notes:
#   - The base image/config is defined once under x-app-common
#   - In prod, tests are bundled in the image (Dockerfile copies /automation, sets TEST_ROOT)
#   - In dev, tests come from the bind-mounted repo (TEST_ROOT defaults to /app/automation)
#   - If VSCode Dev Containers keeps taking port 8000, disable the extension or rename .devcontainer/

x-app-common: &app-common
  build: .            # Build from root Dockerfile (multi-stage; small runtime)
  env_file: .env      # Config stays in env, not baked into image
  ports:
    - "8000:8000"
  pull_policy: build  # Prefer local build; avoids GHCR pulls during iteration

services:
  # Prod-like service (no code mounts, no reload)
  api:
    <<: *app-common
    profiles: ["prod"]
    image: cs-fundamentals:prod
    command: >
      uvicorn cs_fundamentals.main:app
      --host 0.0.0.0
      --port ${PORT:-8000}

  # Dev service (bind-mount source; hot-reload on save)
  api-dev:
    <<: *app-common
    profiles: ["dev"]
    image: cs-fundamentals:dev         # local dev tag (optional)
    environment:
      # Ensure the live-mounted code is importable ahead of site-packages
      PYTHONPATH: /app
    volumes:
      # Live-mount the repo so --reload sees changes immediately
      - .:/app:cached
    command: >
      uvicorn cs_fundamentals.main:app
      --host 0.0.0.0
      --port ${PORT:-8000}
      --reload
      --reload-dir /app

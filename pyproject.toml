[project]
name = "cs-fundamentals"
version = "0.1.0"
description = "Python project to hone computer science fundamentals of data structures, algorithms and problem solving patterns"
readme = "README.md"
requires-python = ">=3.11.13"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "httpx>=0.28.1",
    "pydantic-settings>=2.11.0",
    "numpy>=2.2.5",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.2.0",
    "uvicorn>=0.23.2",
]

#
# Build config
[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cs_fundamentals*"]

[dependency-groups]
dev = [
    "coverage[toml]>=7.11.0",
    "monkeytype>=23.3.0",
    "mypy>=1.13.0",
    "pre-commit>=4.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.11.7",
    "semgrep==1.86.0",
    "types-PyYAML>=6.0.12.20240808",
    "types-requests>=2.32.0.20241016",
]

#
# Test config
[tool.pytest.ini_options]
testpaths = ["automation"]
pythonpath = ["."]
addopts = """
  --strict-config
  --strict-markers
  --maxfail=1
  --import-mode=importlib
  --cov=cs_fundamentals
  --cov-branch
  --cov-report=term-missing:skip-covered
  --cov-report=xml
  --cov-report=html
"""
filterwarnings = [
  "error::DeprecationWarning",
  "ignore::UserWarning:pydantic.*:",
  "ignore::pydantic.warnings.PydanticDeprecatedSince20",
  "ignore::pytest.PytestAssertRewriteWarning",
  "ignore:The configuration option \"asyncio_default_fixture_loop_scope\" is unset.:pytest.PytestDeprecationWarning",
]
log_cli = true
log_cli_level = "INFO"
# Set an explicit default to silence the deprecation in pytest-asyncio:
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["cs_fundamentals"]
omit = [
  "*/__init__.py",
  "cs_fundamentals/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.coverage.html]
directory = "htmlcov"

#
# Linter/Formatter configs
[tool.ruff]
show-fixes = true
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = [
    "C4",      # Flake8 Comprehensions
    "SIM",     # Flake8 Simplify
    "TC",      # Flake8 Type Checker
    "UP",      # PyUpgrade
    "ANN201",  # Missing return type annotation for public function {name}
    "ANN202",  # Missing return type annotation for private function {name}
    "ANN204",  # Missing return type annotation for special method {name}
    "ANN205",  # Missing return type annotation for staticmethod {name}
    "ANN206",  # Missing return type annotation for classmethod {name}
    "TID252",  # Disallow relative imports; prefer absolute
]
ignore = [
    "E501",    # Line too long ({width} > {limit})
    "F403"     # 'from module import *' used; unable to detect undefined names
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.List"     = { msg = "Use built-in list[...] (PEP 585)" }
"typing.Dict"     = { msg = "Use built-in dict[...] (PEP 585)" }
"typing.Tuple"    = { msg = "Use built-in tuple[...] (PEP 585)" }
"typing.Set"      = { msg = "Use built-in set[...] (PEP 585)" }
"typing.Optional" = { msg = "Use T | None (PEP 604)" }

[tool.ruff.lint.flake8-type-checking]
# Keep these modules importable at runtime; don’t force them behind TYPE_CHECKING
exempt-modules = ["pydantic", "pydantic_core", "fastapi"]

[tool.ruff.lint.isort]
known-first-party = ["cs_fundamentals"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

#
# Type-Checker config
[tool.mypy]
python_version = "3.11"
files = ["cs_fundamentals"]
plugins = ["pydantic.mypy"]
pretty = true
show_error_codes = true
warn_unused_configs = true
# Start strict but keep escape hatches below
strict = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
ignore_missing_imports = false
incremental = true
cache_dir = ".mypy_cache"

[[tool.mypy.overrides]]
module = ["automation.*"]
ignore_errors = true

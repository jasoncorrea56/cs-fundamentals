[project]
name = "cs-fundamentals"
version = "0.1.0"
description = "Python project to hone computer science fundamentals of data structures, algorithms and problem solving patterns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.5",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "ruff>=0.11.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.ruff]
show-fixes = true
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "C4",      # Flake8 Comprehensions
    "SIM",     # Flake8 Simulations
    "TC",      # Flake8 Type Checker
    "UP",      # PyUpgrade
    "ANN201",  # Missing return type annotation for public function {name}
    "ANN202",  # Missing return type annotation for private function {name}
    "ANN204",  # Missing return type annotation for special method {name}
    "ANN205",  # Missing return type annotation for staticmethod {name}
    "ANN206",  # Missing return type annotation for classmethod {name}
]
ignore = [
    "E501",    # Line too long ({width} > {limit})
    "F403"     # 'from module import *' used; unable to detect undefined names
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

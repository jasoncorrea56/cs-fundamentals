apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: cs-fundamentals

build:
  platforms: ["linux/arm64"]
  artifacts:
    - image: cs-fundamentals
      context: .
      docker:
        dockerfile: Dockerfile
  local:
    push: false

deploy:
  helm:
    releases:
      - name: csf
        chartPath: helm
        namespace: default
        createNamespace: false
        # Pass Skaffold-built image coordinates to the chart
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO}}"
          image.tag: "{{.IMAGE_TAG}}"
          fullnameOverride: "cs-fundamentals"
        valuesFiles:
          - helm/values.yaml
        wait: true  # Wait for resources to be ready on each deploy
        # Optional: atomic upgrades (roll back on failure)
        # flags:
        #   upgrade:
        #     - --atomic

profiles:
  - name: minikube
    build:
      local:
        push: false
    portForward:
      - resourceType: service
        resourceName: cs-fundamentals
        namespace: default
        port: 80
        localPort: 8080

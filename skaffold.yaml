apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: cs-fundamentals

build:
  platforms: ["linux/arm64"]
  artifacts:
    - image: cs-fundamentals
      context: .
      docker:
        dockerfile: Dockerfile
  local:
    push: false

deploy:
  helm:
    releases:
      - name: csf
        chartPath: ./helm
        namespace: csf
        createNamespace: true
        # Pass Skaffold-built image coordinates to the chart
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO}}"
          image.tag: "{{.IMAGE_TAG}}"
          fullnameOverride: "cs-fundamentals"
        valuesFiles:
          - helm/values.yaml
        wait: true  # Wait for resources to be ready on each deploy
        # Optional: atomic upgrades (roll back on failure)
        # flags:
        #   upgrade:
        #     - --atomic

profiles:
  - name: minikube
    build:
      local:
        push: false

    deploy:
      helm:
        releases:
          - name: csf
            namespace: csf
            chartPath: ./helm
            wait: true
            skipBuildDependencies: true
            createNamespace: true
            setValueTemplates:
              image.repository: "{{.IMAGE_REPO}}"
              image.tag: "{{.IMAGE_TAG}}"
              secret.enabled: "true"
              secret.name: "csf-db"
              secret.data.DB_URL: "{{.DB_URL}}"
            valuesFiles:
              - helm/values-minikube.yaml

    portForward:
      - resourceType: service
        resourceName: csf-cs-fundamentals
        namespace: csf
        port: 80
        localPort: 8080
